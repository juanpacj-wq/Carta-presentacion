# /etc/nginx/sites-available/comunicaciones.conf
#
# Two-domain setup for COMUNICACIONES:
#   - admin.example.com  — admin panel (profile CRUD, protegido por login local)
#   - perfiles.example.com — public profile cards (QR/shared links land here)
#
# Both domains share the same Express API on port 3000.
# nginx serves each client's static build directly for performance.
#
# Install:
#   sudo cp deploy/nginx/comunicaciones.conf /etc/nginx/sites-available/comunicaciones
#   sudo ln -s /etc/nginx/sites-available/comunicaciones /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d admin.example.com -d perfiles.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace admin.example.com / perfiles.example.com with your real domains.

upstream comunicaciones_api {
    server 127.0.0.1:3000;
}

# --- HTTP → HTTPS redirect for both domains ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com perfiles.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================================
# ADMIN domain (admin.example.com)
# ==========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    # Managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Admin SPA static files
    root /opt/comunicaciones/client-admin/dist;
    index index.html;

    # Uploaded photos served directly from disk
    location /uploads/ {
        alias /opt/comunicaciones/server/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_except GET HEAD { deny all; }
    }

    # API proxy — all methods allowed (auth enforced by Express)
    location /api/ {
        proxy_pass http://comunicaciones_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # SPA fallback for admin routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==========================================================
# PUBLIC domain (perfiles.example.com)
# ==========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name perfiles.example.com;

    # Managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/perfiles.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/perfiles.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public users never upload
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Public SPA static files
    root /opt/comunicaciones/client-public/dist;
    index index.html;

    # Uploaded photos served directly from disk
    location /uploads/ {
        alias /opt/comunicaciones/server/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_except GET HEAD { deny all; }
    }

    # API proxy — only GET/HEAD allowed (defense in depth)
    location /api/profiles/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://comunicaciones_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
    }

    # Block all other API routes
    location /api/ {
        return 403;
    }

    # SPA fallback only for /profile/* paths
    location /profile/ {
        try_files $uri /index.html;
    }

    # Block everything else (/, /new, /edit, etc.)
    location / {
        try_files $uri $uri/ =404;
    }
}
