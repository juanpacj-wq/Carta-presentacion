# /etc/nginx/sites-available/comunicaciones.conf
#
# Single-domain setup para COMUNICACIONES bajo cdp.gecelca.com.co:
#   /             -> redirect 301 a /admin/
#   /admin/*      -> client-admin SPA (login + CRUD)
#   /profile/:id  -> client-public SPA (tarjeta publica que encodean los QR)
#   /api/*        -> proxy a Express en 127.0.0.1:3000
#   /uploads/*    -> alias al filesystem de fotos
#
# Requisitos:
#   - Certificados TLS en /etc/ssl/comunicaciones/ (fullchain.crt + private.key)
#   - client-admin construido con base=/admin/ (vite.config.ts lo hace en prod)
#   - Usuario www-data en el grupo comunicaciones (para leer /opt/comunicaciones/**)
#
# Instalacion:
#   sudo cp deploy/nginx/comunicaciones.conf /etc/nginx/sites-available/comunicaciones
#   sudo ln -s /etc/nginx/sites-available/comunicaciones /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reemplaza cdp.gecelca.com.co por tu dominio real si difiere.

upstream comunicaciones_api {
    server 127.0.0.1:3000;
}

# --- HTTP -> HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name cdp.gecelca.com.co;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS principal ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdp.gecelca.com.co;

    ssl_certificate     /etc/ssl/comunicaciones/fullchain.crt;
    ssl_certificate_key /etc/ssl/comunicaciones/private.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permite subir fotos desde el admin (limite del server es 5 MB; dejamos 6 de margen)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- Uploads servidos directamente desde disco ---
    location /uploads/ {
        alias /opt/comunicaciones/server/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_except GET HEAD { deny all; }
    }

    # --- API (Express enforza auth, CSRF y rate-limit) ---
    location /api/ {
        proxy_pass http://comunicaciones_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # --- Admin SPA bajo /admin/ ---
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/comunicaciones/client-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- Public SPA en root (solo /profile/*) ---
    root /opt/comunicaciones/client-public/dist;
    index index.html;

    # Raiz del dominio -> admin
    location = / {
        return 301 /admin/;
    }

    location /profile/ {
        try_files $uri /index.html;
    }

    # Cualquier otra ruta: 404 (no exponer el index publico fuera de /profile/)
    location / {
        try_files $uri =404;
    }
}
